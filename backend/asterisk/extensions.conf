; ═══════════════════════════════════════════════════════════
;  Dialplan
; ═══════════════════════════════════════════════════════════

[general]
static=yes
writeprotect=no

; ─── Исходящие через Zadarma → ARI ───────────────────────
[outgoing-zadarma]
exten => _X.,1,NoOp(Outgoing call to ${EXTEN})
 same => n,Stasis(ai-agent,${EXTEN})
 same => n,Hangup()

; ─── Входящие от Zadarma АТС → ARI ───────────────────────
; Zadarma сначала звонит НАМ (callback модель), потом соединяет с клиентом
[from-zadarma]
exten => _X.,1,NoOp(Incoming from Zadarma: ${EXTEN} CallerID: ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(ai-agent,inbound,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

; ─── Default ──────────────────────────────────────────────
[default]
exten => s,1,Hangup()
