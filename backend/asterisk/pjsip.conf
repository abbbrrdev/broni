; ═══════════════════════════════════════════════════════════
;  PJSIP — Zadarma trunk
;  Replace every YOUR_* placeholder below with your own Zadarma
;  SIP credentials and public server IP before deploying.
; ═══════════════════════════════════════════════════════════

; ─── UDP Transport (for media/RTP) ─────────────────────────
; IMPORTANT: external_media_address must be a PUBLIC IP,
; not host.docker.internal (Zadarma cannot reach that)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=YOUR_SERVER_PUBLIC_IP
external_signaling_address=YOUR_SERVER_PUBLIC_IP

; ─── TCP Transport (for signaling — avoids NAT timeout) ────
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=10.0.0.0/8
external_media_address=YOUR_SERVER_PUBLIC_IP
external_signaling_address=YOUR_SERVER_PUBLIC_IP

; ─── Auth ───────────────────────────────────────────────────
[zadarma-auth]
type=auth
auth_type=userpass
username=YOUR_ZADARMA_SIP_LOGIN
password=YOUR_ZADARMA_SIP_PASSWORD

; ─── AOR ────────────────────────────────────────────────────
[zadarma-aor]
type=aor
contact=sip:pbx.zadarma.com

; ─── Endpoint ───────────────────────────────────────────────
[zadarma]
type=endpoint
transport=transport-tcp
context=from-zadarma
disallow=all
allow=alaw
allow=ulaw
outbound_auth=zadarma-auth
aors=zadarma-aor
from_user=YOUR_ZADARMA_SIP_LOGIN
from_domain=pbx.zadarma.com
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
media_encryption=no
media_encryption_optimistic=no
rtp_timeout=60
ice_support=no

; ─── Identify: accept OPTIONS/INVITE from Zadarma ──────────
[zadarma-identify]
type=identify
endpoint=zadarma
match=185.45.152.0/24
match=185.45.155.0/24
match=195.122.19.0/24
match=31.31.222.0/24
match=pbx.zadarma.com

; ─── Registration over TCP ──────────────────────────────────
[zadarma-reg]
type=registration
transport=transport-tcp
outbound_auth=zadarma-auth
server_uri=sip:pbx.zadarma.com
client_uri=sip:YOUR_ZADARMA_SIP_LOGIN@pbx.zadarma.com
expiration=60
retry_interval=10
max_retries=999
contact_user=YOUR_ZADARMA_SIP_LOGIN
